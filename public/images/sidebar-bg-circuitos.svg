<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1200" viewBox="0 0 600 1200" fill="none">
  <!-- Fondo del menú lateral · Solución Digital (soluciondigital.dev) -->
  <defs>
    <radialGradient id="glowBottom" cx="20%" cy="100%" r="75%">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#1d4ed8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTop" cx="100%" cy="0%" r="60%">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#93c5fd" fill-opacity="0.22"/>
    </pattern>
    <!-- Los circuitos se ven más abajo y se desvanecen hacia arriba (donde están las opciones) -->
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="fadeMask">
      <rect width="600" height="1200" fill="url(#fade)"/>
    </mask>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="600" height="1200" fill="url(#glowBottom)"/>
  <rect width="600" height="1200" fill="url(#glowTop)"/>
  <rect width="600" height="1200" fill="url(#dots)" mask="url(#fadeMask)"/>

  <!-- Líneas de circuito -->
  <g mask="url(#fadeMask)" stroke="url(#trace)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.55">
    <path d="M-10 1060 H120 L180 1000 H330 L390 940 V820"/>
    <path d="M-10 1120 H210 L260 1070 H470 L530 1010 H610"/>
    <path d="M60 1210 V1150 L110 1100 H250"/>
    <path d="M300 1210 V1160 L340 1120 H560"/>
    <path d="M610 880 H500 L450 830 V700 L400 650 H300"/>
    <path d="M-10 900 H70 L120 850 V720"/>
    <path d="M610 1080 H560 L520 1040 V960"/>
    <path d="M200 1000 V880 L240 840 H330"/>
    <path d="M610 600 H530 L480 550 V430"/>
    <path d="M-10 640 H40 L90 590 H180"/>
  </g>

  <!-- Nodos (terminales de los circuitos) -->
  <g mask="url(#fadeMask)" fill="#0b1b33" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.8">
    <circle cx="390" cy="820" r="6"/>
    <circle cx="250" cy="1100" r="6"/>
    <circle cx="560" cy="1120" r="6"/>
    <circle cx="300" cy="650" r="6"/>
    <circle cx="120" cy="720" r="6"/>
    <circle cx="520" cy="960" r="6"/>
    <circle cx="330" cy="840" r="6"/>
    <circle cx="480" cy="430" r="6"/>
    <circle cx="180" cy="590" r="6"/>
  </g>
  <g mask="url(#fadeMask)" fill="#93c5fd">
    <circle cx="390" cy="820" r="2.2"/>
    <circle cx="250" cy="1100" r="2.2"/>
    <circle cx="560" cy="1120" r="2.2"/>
    <circle cx="330" cy="840" r="2.2"/>
    <circle cx="520" cy="960" r="2.2"/>
  </g>

  <!-- Símbolo de código, grande y muy tenue -->
  <g mask="url(#fadeMask)" stroke="#60a5fa" stroke-opacity="0.18" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M255 935 L195 1000 L255 1065"/>
    <path d="M345 935 L405 1000 L345 1065"/>
    <path d="M318 920 L282 1080"/>
  </g>
</svg>
